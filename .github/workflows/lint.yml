name: Lint
on: [push, pull_request]
jobs:
  lint:
    uses: open-contracting/.github/.github/workflows/lint.yml@main
    permissions:
      contents: read
    with:
      # test_requirements.py ignores try/except blocks.
      standard-maintenance-scripts-ignore: importlib_resources
      # Used in tests.
      ocds-schema-exceptions: ocds-simplified-schema.json
